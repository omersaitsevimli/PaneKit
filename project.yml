name: PaneKit
options:
  bundleIdPrefix: com.panekit
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    # Stable bundle ID for TCC. Prefer Release install via scripts/build-release.sh
    # (~/Applications/PaneKit.app) instead of DerivedData paths that change each build.
    PRODUCT_BUNDLE_IDENTIFIER: com.panekit.PaneKit
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
targets:
  PaneKit:
    type: application
    platform: macOS
    sources:
      - path: PaneKit
    settings:
      base:
        INFOPLIST_FILE: PaneKit/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: PaneKit/App/PaneKit.entitlements
        PRODUCT_NAME: PaneKit
        PRODUCT_BUNDLE_IDENTIFIER: com.panekit.PaneKit
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
    info:
      path: PaneKit/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: PaneKit
        CFBundleDisplayName: PaneKit
        CFBundleIdentifier: com.panekit.PaneKit
        CFBundleVersion: "11"
        CFBundleShortVersionString: "2.0.0"
        NSAccessibilityUsageDescription: "PaneKit needs Accessibility access to move and resize windows."
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
    entitlements:
      path: PaneKit/App/PaneKit.entitlements
